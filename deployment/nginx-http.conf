server {
    listen 80;
    server_name accredited.co.in www.accredited.co.in;
    root /var/www/accredited;
    index index.php index.html;

    # Logs
    access_log /var/log/nginx/accredited_access.log;
    error_log /var/log/nginx/accredited_error.log;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/javascript application/xml application/json;

    # Static files caching
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|eot|css|js)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # PHP handling
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }
    
    # Deny access to sensitive directories
    location ^~ /includes/ { deny all; return 403; }
    location ^~ /database/ { deny all; return 403; }
    location ^~ /deployment/ { deny all; return 403; }
    location ^~ /cache/ { deny all; return 403; }
}
